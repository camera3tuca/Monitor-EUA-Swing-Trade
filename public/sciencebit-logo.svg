<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <!-- ScienceBit Wordmark -->
  <g id="sciencebit-wordmark">
    <!-- "Science" in black -->
    <text x="35" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#0A0E17" letter-spacing="-1.5">Science</text>
    <!-- "Bit" in vivid blue -->
    <text x="268" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#0062FF" letter-spacing="-1.5">Bit</text>
  </g>
  
  <!-- Subtitle: — COMPUTER — -->
  <g id="computer-subtitle">
    <!-- Left Accent Line -->
    <line x1="42" y1="98" x2="108" y2="98" stroke="#0062FF" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- COMPUTER uppercase text -->
    <text x="210" y="103" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0A0E17" text-anchor="middle" letter-spacing="8">COMPUTER</text>
    
    <!-- Right Accent Line -->
    <line x1="312" y1="98" x2="378" y2="98" stroke="#0062FF" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
