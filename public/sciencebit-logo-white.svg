<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <!-- ScienceBit Wordmark (White/Dark Theme) -->
  <g id="sciencebit-wordmark-dark">
    <!-- "Science" in white -->
    <text x="35" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Science</text>
    <!-- "Bit" in bright tech blue -->
    <text x="268" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#2563EB" letter-spacing="-1.5">Bit</text>
  </g>
  
  <!-- Subtitle: — COMPUTER — -->
  <g id="computer-subtitle-dark">
    <!-- Left Accent Line -->
    <line x1="42" y1="98" x2="108" y2="98" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- COMPUTER uppercase text -->
    <text x="210" y="103" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">COMPUTER</text>
    
    <!-- Right Accent Line -->
    <line x1="312" y1="98" x2="378" y2="98" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
