<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Clean white app store squircle) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <style>
      .w-g { stroke: #00c853; stroke-width: 4.5; stroke-linecap: round; }
      .w-r { stroke: #ff1744; stroke-width: 4.5; stroke-linecap: round; }
      .b-g { fill: #00c853; rx: 3; }
      .b-r { fill: #ff1744; rx: 3; }
    </style>
  </defs>

  <!-- 1. Background Container (Play Store Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 2. Japanese Candlesticks Field -->
  <g id="candlesticks" filter="url(#subtleShadow)">
    <!-- 1. Green (Far Left low) -->
    <line x1="73" y1="240" x2="73" y2="410" class="w-g"/>
    <rect x="54" y="270" width="38" height="112" class="b-g"/>

    <!-- 2. Green (Left tall) -->
    <line x1="112" y1="142" x2="112" y2="340" class="w-g"/>
    <rect x="94" y="172" width="36" height="162" class="b-g"/>

    <!-- 3. Red (Left-Mid) -->
    <line x1="150" y1="152" x2="150" y2="396" class="w-r"/>
    <rect x="133" y="182" width="34" height="44" class="b-r"/>

    <!-- 4. Green (Mid-Left small) -->
    <line x1="184" y1="176" x2="184" y2="360" class="w-g"/>
    <rect x="170" y="180" width="28" height="38" class="b-g"/>

    <!-- 5. Green (Center-Left tall) -->
    <line x1="216" y1="126" x2="216" y2="370" class="w-g"/>
    <rect x="201" y="152" width="32" height="52" class="b-g"/>

    <!-- 6. Red (Center tall) -->
    <line x1="256" y1="88" x2="256" y2="376" class="w-r"/>
    <rect x="238" y="115" width="36" height="66" class="b-r"/>

    <!-- 7. Green (Center small) -->
    <line x1="292" y1="128" x2="292" y2="355" class="w-g"/>
    <rect x="278" y="132" width="28" height="38" class="b-g"/>

    <!-- 8. Red (Center-Right tallest) -->
    <line x1="327" y1="68" x2="327" y2="330" class="w-r"/>
    <rect x="309" y="98" width="36" height="72" class="b-r"/>

    <!-- 9. Green (Mid-Right) -->
    <line x1="365" y1="100" x2="365" y2="354" class="w-g"/>
    <rect x="350" y="128" width="32" height="46" class="b-g"/>

    <!-- 10. Red (Right) -->
    <line x1="405" y1="132" x2="405" y2="376" class="w-r"/>
    <rect x="388" y="160" width="34" height="52" class="b-r"/>

    <!-- 11. Green (Far Right tall) -->
    <line x1="446" y1="122" x2="446" y2="340" class="w-g"/>
    <rect x="430" y="120" width="33" height="112" class="b-g"/>
  </g>

