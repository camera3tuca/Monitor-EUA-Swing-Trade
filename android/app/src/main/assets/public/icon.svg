          fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 408,246 C 430,248 456,260 472,274 C 476,276 478,272 475,268 C 458,252 436,240 412,238 Z"
          fill="#111827"/>

    <!-- White Eye Crescent -->
    <path d="M 384,258 C 392,260 396,267 396,272 C 392,270 387,268 384,264 Z" fill="#ffffff"/>
